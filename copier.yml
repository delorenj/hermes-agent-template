# hermes-agent-template
# https://copier.readthedocs.io/
#
# Provisions a single Hermes agent role into an existing repository.
#
# Usage:
#   cd /path/to/your-project
#   copier copy gh:delorenj/hermes-agent-template ./agents/hermes/pm \
#     --data role=pm
#
# What it does:
#   1. Renders agents/hermes/<role>/{role.yaml, SOUL.md, hermes, .scripts/}
#   2. Creates ignored local state at agents/hermes/<role>/runtime/ and delegates
#      named-profile wiring to `pj migrate hermes.runtime-singleton`
#   4. Creates a Plane project in 33god workspace
#   6. Verifies a BotFather token, stores it in 1Password, and maps an op:// reference
#   7. Optionally does the same for a dedicated Slack app+bot pair
#   8. Records fleet-shared Bloodbank routing identity (no profile consumer)
#   9. Installs a profile gateway + heartbeat timer (reconcile + checkpoint)
#  10. Appends to ~/.hermes/agents-registry.yaml
#
# Environment-specific defaults (Hermes binary path, legacy archive owner, Plane
# workspace/URL, NATS endpoint, skills dir, …) are NOT hardcoded — they live in
# ~/.config/hermes-agent-template/config.toml, seeded from config.example.toml on
# first run. Edit that file to retarget the template for a different machine/user.

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"
_exclude:
  - "**/__pycache__"
  - "**/*.pyc"
  - "**/*.pyo"

# ─── Questions (only what we can't derive) ───────────────────────────────

target_repo:
  type: str
  help: "Name of the project repo this agent belongs to"
  validator: "{% if not target_repo %}Required{% endif %}"
  # No default — must be provided explicitly via --data or interactively.
  # Path-based auto-derivation is unreliable across relative/absolute dst_path.

role:
  type: str
  help: "Role for this agent (safe single path segment; arbitrary roles are supported)"
  default: pm
  validator: >-
    {% set alnum = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789' -%}
    {% set safe_chars = alnum ~ '._-' -%}
    {% if not role or role != role|trim or role in ['.', '..'] or role[0] not in alnum or role[-1] not in alnum or role|reject('in', safe_chars)|list|length -%}
    Role must be a non-empty safe single path segment using letters, numbers, dots, underscores, or hyphens
    {%- endif %}

ticket_provider:
  type: str
  help: "Ticket system this agent's board lives in"
  default: plane
  choices:
    "Linear": linear
    "Plane": plane
    "Trello": trello

agent_purpose:
  type: str
  help: "One-line description of what this agent does in this repo"
  default: "{% if role == 'reporter' %}Company-wide evidence gathering, freshness-aware daily reporting, and critical delivery monitoring{% elif role == 'director' %}Company-level portfolio orchestration, delegation, and cross-project control{% else %}Project management, triage, and continuous board reconciliation{% endif %}"

model_provider:
  type: str
  help: "Inference provider (empty = inherit from global ~/.hermes config)"
  default: ""

model_name:
  type: str
  help: "Model name (empty = inherit from global ~/.hermes config)"
  default: ""

model_base_url:
  type: str
  help: "Per-agent model API base URL (empty = inherit from shared config)"
  default: ""

model_api_mode:
  type: str
  help: "Per-agent model API protocol (empty = inherit from shared config)"
  default: ""
  choices:
    "Inherit from shared config": ""
    "OpenAI-compatible chat completions": chat_completions
    "OpenAI Codex responses": codex_responses
    "Anthropic messages": anthropic_messages
    "AWS Bedrock converse": bedrock_converse
    "Codex app server": codex_app_server

model_key_env:
  type: str
  help: "Environment variable NAME holding the per-agent model key (never the key value)"
  default: ""

soul_tone:
  type: str
  help: "Tone for the agent's SOUL.md"
  default: direct
  choices:
    - direct
    - playful
    - formal
    - terse

reconcile_enabled:
  type: bool
  help: "Run autonomous PM ticket-board reconciliation from the heartbeat timer"
  default: true

# ─── Derived (never asked) ───────────────────────────────────────────────

agent_id:
  type: str
  default: "{{ target_repo }}-{{ role }}"
  when: false

display_name:
  type: str
  # Short roles (pm, dev, ops, qa, ci) get uppercased; longer ones get title-cased.
  default: "{{ target_repo|title }} {% if role|length <= 3 %}{{ role|upper }}{% else %}{{ role|title }}{% endif %}"
  when: false

bot_handle:
  type: str
  default: "{{ target_repo|lower|replace('-','_') }}_{{ role|lower }}_bot"
  when: false

runtime_repo:
  type: str
  default: "agent-hm-{{ target_repo|lower }}-{{ role|lower }}"
  when: false

runtime_repo_owner:
  type: str
# Legacy archive identity only. Empty by default — resolved at provision time from
  # ~/.config/hermes-agent-template/config.toml [github].runtime_repo_owner.
  # Pass --data runtime_repo_owner=<owner> to override per-run.
  default: ""
  when: false

plane_workspace:
  type: str
  # Empty by default — resolved at provision time from
  # ~/.config/hermes-agent-template/config.toml [plane].workspace.
  default: ""
  when: false

# ─── Post-generation tasks ───────────────────────────────────────────────
# Order matters. Each script logs to .scripts/.provision.log.
# All scripts are idempotent — safe to re-run if a step fails.

_tasks:
  - "chmod +x .scripts/*.sh .scripts/sentinel/bin/*.sh hermes momo 2>/dev/null || true"
  - "./.scripts/00-banner.sh"
  - "./.scripts/01-config.sh"
  - "./.scripts/05-fleet-env.sh"
  - "./.scripts/10-hermes-profile.sh"
  - "./.scripts/20-runtime-repo.sh"
  - "./.scripts/30-telegram.sh"
  - "./.scripts/31-slack.sh"
  - "./.scripts/42-ticket-provider.sh"
  - "./.scripts/60-bloodbank.sh"
  - "./.scripts/70-systemd.sh"
  - "./.scripts/80-registry.sh"
  - "./.scripts/99-summary.sh"

_skip_if_exists:
  # role.yaml contains verified channel identities and explicit operator
  # choices (including reconcile_enabled=false).  A forced Copier refresh must
  # preserve those durable values; the idempotent tasks below reconcile any
  # newly-required fields and lifecycle assets around them.
  - role.yaml
  - runtime
